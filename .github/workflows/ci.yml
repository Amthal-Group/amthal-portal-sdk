name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Bridge and wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The wrappers resolve @amthal-group/portal-bridge from its dist, so the bridge has to
      # be built before anything type-checks against it.
      - run: npm run build
      - run: npm run typecheck

  ios:
    name: iOS SDK
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # NOT `swift build`: the package imports UIKit, so it must be built for an iOS
      # destination. swift build targets the host and fails with "no such module 'UIKit'".
      - run: xcodebuild -scheme AmthalPortal -destination 'generic/platform=iOS' build

      # The Expo module does not compile ios/Sources directly — CocoaPods cannot reference sources
      # outside a pod's own directory, so the podspec builds a COPY under wrappers/expo/ios/Generated.
      # Nothing refreshes that copy on its own: `prepare_command` is skipped for local path pods, so
      # a Swift change here leaves the copy behind and the only symptom is a failed release archive,
      # long after the change. `npm run build` re-vendors it; this proves it stayed in step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Vendored Expo copy matches the Swift source
        run: diff -r ios/Sources/AmthalPortal wrappers/expo/ios/Generated

  android:
    name: Android SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AGP 8.7 refuses to run on JDK 11.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :portal-sdk:assembleRelease --no-daemon
        working-directory: android
